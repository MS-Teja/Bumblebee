<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bumblebee — Folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090C}
a{color:#F7F8FA;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit}
@keyframes eqA{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #07090C; font-family: 'Manrope', sans-serif; color: #F7F8FA; user-select: none; -webkit-user-select: none">
  <div style="position: absolute; left: -240px; top: -200px; width: 760px; height: 760px; border-radius: 50%; background: #E2557B; opacity: 0.20; filter: blur(130px)"></div>
  <div style="position: absolute; left: 80px; top: 300px; width: 420px; height: 420px; border-radius: 50%; background: #1D3557; opacity: 0.45; filter: blur(120px)"></div>

  <div style="position: relative; display: flex; width: 1280px; height: 720px">
    <div style="position: relative; flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; height: 720px">
      <div style="display: flex; flex: 1 1 auto; min-height: 0">

        <!-- Hero (passenger side) -->
        <section style="flex: 0 0 380px; padding: 34px 20px 0 40px; box-sizing: border-box">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; width: 300px; height: 300px; border-radius: 30px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.45)">
            <div style="background: linear-gradient(140deg, #3B2A7A 0%, #E2557B 100%)"></div>
            <div style="background: linear-gradient(140deg, #1D3557 0%, #E76F51 100%)"></div>
            <div style="background: linear-gradient(140deg, #0E5E6F 0%, #F2C14E 100%)"></div>
            <div style="background: linear-gradient(140deg, #8A1C14 0%, #F08A24 100%)"></div>
          </div>
          <h1 style="margin: 22px 0 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em">Road Trip</h1>
          <div style="margin-top: 6px; font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.62)">42 songs · 2 h 31 m</div>
          <div style="display: flex; align-items: center; gap: 14px; margin-top: 22px">
            <button type="button" onClick="{{playAll}}" style="display: flex; align-items: center; gap: 10px; height: 72px; padding: 0 30px 0 24px; border-radius: 36px; border: none; cursor: pointer; background: #FF8FB0; color: #0B0C0F; font-size: 21px; font-weight: 800">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4a1 1 0 0 0-1.5.86z"></path></svg>
              Play
            </button>
            <button type="button" aria-label="Shuffle folder" onClick="{{shuffleAll}}" style="width: 72px; height: 72px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid rgba(255,255,255,0.28); color: #F7F8FA">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path></svg>
            </button>
          </div>
        </section>

        <!-- Content (driver side) -->
        <section style="flex: 1 1 auto; min-width: 0; padding: 26px 30px 0 8px; box-sizing: border-box; display: flex; flex-direction: column">
          <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 8px; height: 56px">
            <a href="Home.dc.html" aria-label="Up one folder" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.08)">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
            </a>
            <a href="Home.dc.html" style="padding: 12px 10px; font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.6)">SanDisk USB</a>
            <span style="color: rgba(255,255,255,0.3); font-size: 18px">›</span>
            <a href="Home.dc.html" style="padding: 12px 10px; font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.6)">Music</a>
            <span style="color: rgba(255,255,255,0.3); font-size: 18px">›</span>
            <span style="padding: 12px 10px; font-size: 18px; font-weight: 800">Road Trip</span>
          </nav>

          <div style="display: flex; gap: 12px; margin-top: 12px">
            <sc-for list="{{subs}}" as="sub" hint-placeholder-count="3">
              <a href="Folder.dc.html" style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 12px; height: 84px; padding: 0 12px; border-radius: 22px; background: rgba(255,255,255,0.06)">
                <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; flex: 0 0 60px; width: 60px; height: 60px; border-radius: 14px; overflow: hidden">
                  <sc-for list="{{sub.tiles}}" as="tile" hint-placeholder-count="4">
                    <div style="background: linear-gradient(140deg, {{tile.a}} 0%, {{tile.b}} 100%)"></div>
                  </sc-for>
                </div>
                <div style="min-width: 0">
                  <div style="font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sub.name}}</div>
                  <div style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.55)">{{sub.count}}</div>
                </div>
              </a>
            </sc-for>
          </div>

          <div style="position: relative; flex: 1 1 auto; min-height: 0; margin-top: 14px; overflow-y: auto; overflow-x: hidden">
            <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
              <div style="position: relative; height: 76px; border-radius: 20px; overflow: hidden">
                <div style="position: absolute; inset: 0; display: flex; align-items: center; padding-left: 22px; border-radius: 20px; background: rgba(255,143,176,0.22); color: #FF8FB0; font-size: 17px; font-weight: 800; letter-spacing: 0.06em; opacity: {{row.revealOpacity}}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h7"></path><path d="M18 15v6M15 18h6"></path></svg>
                  <span style="margin-left: 10px">{{row.revealText}}</span>
                </div>
                <div style="position: absolute; inset: 0; display: flex; align-items: center; gap: 16px; padding: 0 18px 0 14px; border-radius: 20px; background: {{row.bg}}; transform: translateX({{row.dx}}px); transition: {{row.transition}}; touch-action: pan-y; cursor: pointer" onPointerDown="{{row.down}}" onPointerMove="{{row.move}}" onPointerUp="{{row.up}}" onPointerCancel="{{row.up}}" onClick="{{row.play}}">
                  <div style="flex: 0 0 34px; text-align: right; font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums">
                    <sc-if value="{{row.notPlaying}}" hint-placeholder-val="{{true}}"><span>{{row.no}}</span></sc-if>
                    <sc-if value="{{row.playing}}" hint-placeholder-val="{{false}}">
                      <span style="display: inline-flex; align-items: flex-end; gap: 3px; height: 18px">
                        <span style="width: 4px; height: 18px; border-radius: 2px; background: #FF8FB0; transform-origin: bottom; animation: eqA 0.9s ease-in-out infinite"></span>
                        <span style="width: 4px; height: 18px; border-radius: 2px; background: #FF8FB0; transform-origin: bottom; animation: eqA 0.9s ease-in-out -0.3s infinite"></span>
                        <span style="width: 4px; height: 18px; border-radius: 2px; background: #FF8FB0; transform-origin: bottom; animation: eqA 0.9s ease-in-out -0.6s infinite"></span>
                      </span>
                    </sc-if>
                  </div>
                  <div style="flex: 1 1 auto; min-width: 0">
                    <div style="font-size: 20px; font-weight: 700; color: {{row.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.title}}</div>
                    <div style="margin-top: 2px; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.artist}}</div>
                  </div>
                  <div style="font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.5); font-variant-numeric: tabular-nums">{{row.time}}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </section>
      </div>

      <!-- Mini-player -->
      <div style="position: relative; flex: 0 0 104px; height: 104px; display: flex; align-items: center; gap: 18px; padding: 0 26px 0 22px; box-sizing: border-box; background: linear-gradient(90deg, rgba(59,42,122,0.55) 0%, rgba(226,85,123,0.30) 50%, rgba(20,24,29,0.9) 100%); border-top: 1px solid rgba(255,255,255,0.06)">
        <div style="position: absolute; left: 0; top: -1px; height: 3px; width: 38%; background: #FF8FB0"></div>
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 18px; flex: 1 1 auto; min-width: 0; height: 104px">
          <div style="position: relative; flex: 0 0 76px; width: 76px; height: 76px; border-radius: 16px; overflow: hidden; background: linear-gradient(140deg, {{np.c1}} 0%, {{np.c2}} 100%)">
            <div style="position: absolute; left: 8px; bottom: -2px; font-size: 36px; font-weight: 800; color: rgba(255,255,255,0.9)">{{np.initial}}</div>
          </div>
          <div style="min-width: 0">
            <div style="font-size: 21px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{np.title}}</div>
            <div style="margin-top: 2px; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{np.artist}}</div>
          </div>
        </a>
        <button type="button" aria-label="Previous" style="width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; color: #F7F8FA">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M19 20 9 12l10-8z"></path><path d="M5 19V5" fill="none" stroke-width="2.6" stroke-linecap="round"></path></svg>
        </button>
        <button type="button" aria-label="Pause" style="width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #F7F8FA; color: #0B0C0F">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.4"></rect><rect x="13.9" y="4" width="4.6" height="16" rx="1.4"></rect></svg>
        </button>
        <button type="button" aria-label="Next" style="width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; color: #F7F8FA">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 10 8-10 8z"></path><path d="M19 5v14" fill="none" stroke-width="2.6" stroke-linecap="round"></path></svg>
        </button>
      </div>

      <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: 50%; bottom: 128px; padding: 14px 24px; border-radius: 99px; background: #F7F8FA; color: #07090C; font-size: 18px; font-weight: 800; animation: toastIn 2.2s ease forwards; white-space: nowrap">{{toastText}}</div>
      </sc-if>
    </div>

    <nav aria-label="Main" style="position: relative; flex: 0 0 132px; width: 132px; height: 720px; box-sizing: border-box; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,0.035); border-left: 1px solid rgba(255,255,255,0.06)">
      <div style="text-align: center; font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; margin-bottom: 18px">8:50</div>
      <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; color: rgba(255,255,255,0.78)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <span style="font-size: 14px; font-weight: 700">Playing</span>
      </a>
      <a href="Home.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; background: rgba(255,143,176,0.16); color: #FF8FB0">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
        <span style="font-size: 14px; font-weight: 700">Home</span>
      </a>
      <a href="Folder.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; color: rgba(255,255,255,0.78)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect></svg>
        <span style="font-size: 14px; font-weight: 700">Library</span>
      </a>
      <button type="button" style="all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; color: rgba(255,255,255,0.78)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="font-size: 14px; font-weight: 700">Search</span>
      </button>
      <div style="flex: 1 1 auto"></div>
      <button type="button" aria-label="Settings" style="all: unset; cursor: pointer; display: flex; justify-content: center; padding: 14px 0; color: rgba(255,255,255,0.6)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
      </button>
      <button type="button" aria-label="Exit to launcher" style="all: unset; cursor: pointer; display: flex; justify-content: center; padding: 14px 0; color: rgba(255,255,255,0.6)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
      </button>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
const FOLDER_PAL = {
  pink: { a: '#3B2A7A', b: '#E2557B' }, sea: { a: '#0E5E6F', b: '#F2C14E' }, ember: { a: '#8A1C14', b: '#F08A24' },
  dusk: { a: '#1D3557', b: '#E76F51' }, teal: { a: '#264653', b: '#2A9D8F' }, sky: { a: '#1B4FBF', b: '#7FD3FF' },
  plum: { a: '#4A1942', b: '#C33C54' }, gold: { a: '#5C3D00', b: '#FFC72C' }
};
const FOLDER_SONGS = [
  { title: 'Samajavaragamana', artist: 'Sid Sriram', time: '3:41', c1: '#3B2A7A', c2: '#E2557B' },
  { title: 'Hooked on a Feeling', artist: 'Blue Swede', time: '2:52', c1: '#1D3557', c2: '#E76F51' },
  { title: 'Butta Bomma', artist: 'Armaan Malik', time: '3:17', c1: '#0E5E6F', c2: '#F2C14E' },
  { title: 'Naatu Naatu', artist: 'Rahul Sipligunj, Kaala Bhairava', time: '3:34', c1: '#8A1C14', c2: '#F08A24' },
  { title: 'Life Is a Highway', artist: 'Tom Cochrane', time: '4:26', c1: '#264653', c2: '#2A9D8F' },
  { title: 'Mr. Blue Sky', artist: 'Electric Light Orchestra', time: '5:03', c1: '#1B4FBF', c2: '#7FD3FF' },
  { title: 'Inkem Inkem Inkem Kaavaale', artist: 'Sid Sriram', time: '4:19', c1: '#4A1942', c2: '#C33C54' },
  { title: 'Don’t Stop Me Now', artist: 'Queen', time: '3:29', c1: '#5C3D00', c2: '#FFC72C' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playingIdx: 0, dragRow: -1, dx: 0, settling: false, toast: '', toastKey: 0 };
    this.drag = null;
    this.suppressUntil = 0;
  }
  componentWillUnmount() { clearTimeout(this.tt); clearTimeout(this.ts); }

  showToast(text) {
    this.setState({ toast: text, toastKey: this.state.toastKey + 1 });
    clearTimeout(this.tt);
    this.tt = setTimeout(() => this.setState({ toast: '' }), 2200);
  }

  renderVals() {
    const s = this.state;
    const np = FOLDER_SONGS[s.playingIdx];
    const rows = FOLDER_SONGS.map((song, i) => {
      const dragging = s.dragRow === i;
      const dx = dragging ? s.dx : 0;
      return {
        no: i + 1,
        title: song.title,
        artist: song.artist,
        time: song.time,
        playing: i === s.playingIdx,
        notPlaying: i !== s.playingIdx,
        titleColor: i === s.playingIdx ? '#FF8FB0' : '#F7F8FA',
        bg: i === s.playingIdx ? 'rgba(255,143,176,0.10)' : (dragging ? '#14181D' : 'transparent'),
        dx,
        transition: dragging && !s.settling ? 'none' : 'transform 300ms cubic-bezier(.22,1.12,.36,1)',
        revealOpacity: dragging ? Math.min(1, dx / 90) : 0,
        revealText: dx > 110 ? 'RELEASE: PLAY NEXT' : 'PLAY NEXT',
        down: (e) => {
          const el = e.currentTarget;
          const r = el.getBoundingClientRect();
          this.drag = { i, x: e.clientX, y: e.clientY, id: e.pointerId, claimed: false, el, scale: r.width / el.offsetWidth || 1 };
        },
        move: (e) => {
          const d = this.drag;
          if (!d || d.id !== e.pointerId) return;
          const mx = (e.clientX - d.x) / d.scale;
          const my = (e.clientY - d.y) / d.scale;
          if (!d.claimed) {
            if (mx > 20 && mx > Math.abs(my) * 1.7) {
              d.claimed = true;
              try { d.el.setPointerCapture(e.pointerId); } catch (err) {}
            } else return;
          }
          this.setState({ dragRow: d.i, dx: Math.max(0, Math.min(170, mx)), settling: false });
        },
        up: () => {
          const d = this.drag;
          this.drag = null;
          if (!d || !d.claimed) return;
          this.suppressUntil = Date.now() + 80;
          const commit = this.state.dx > 110;
          this.setState({ dx: 0, settling: true });
          clearTimeout(this.ts);
          this.ts = setTimeout(() => this.setState({ dragRow: -1, settling: false }), 320);
          if (commit) this.showToast('Plays next: ' + FOLDER_SONGS[d.i].title);
        },
        play: () => {
          if (Date.now() < this.suppressUntil) return;
          this.setState({ playingIdx: i });
        }
      };
    });
    return {
      rows,
      np: { title: np.title, artist: np.artist, c1: np.c1, c2: np.c2, initial: np.title[0] },
      toast: !!s.toast,
      toastText: s.toast,
      playAll: () => { this.setState({ playingIdx: 0 }); this.showToast('Playing Road Trip'); },
      shuffleAll: () => { this.setState({ playingIdx: 4 }); this.showToast('Shuffling Road Trip + subfolders'); },
      subs: [
        { name: 'Long Drives', count: '24 songs', tiles: [FOLDER_PAL.teal, FOLDER_PAL.sky, FOLDER_PAL.dusk, FOLDER_PAL.sea] },
        { name: 'Night Drive', count: '17 songs', tiles: [FOLDER_PAL.plum, FOLDER_PAL.dusk, FOLDER_PAL.pink, FOLDER_PAL.sky] },
        { name: 'Monsoon', count: '12 songs', tiles: [FOLDER_PAL.sea, FOLDER_PAL.teal, FOLDER_PAL.gold, FOLDER_PAL.plum] }
      ]
    };
  }
}
</script>
</body>
</html>
