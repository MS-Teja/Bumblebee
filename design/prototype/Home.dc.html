<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bumblebee — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090C}
a{color:#F7F8FA;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #07090C; font-family: 'Manrope', sans-serif; color: #F7F8FA">
  <div style="position: absolute; left: -200px; top: -320px; width: 900px; height: 700px; border-radius: 50%; background: #E2557B; opacity: 0.16; filter: blur(140px)"></div>

  <div style="position: relative; display: flex; width: 1280px; height: 720px">
    <main style="flex: 1 1 auto; min-width: 0; padding: 30px 36px 0 40px; box-sizing: border-box; display: flex; flex-direction: column">

      <div style="display: flex; align-items: baseline; justify-content: space-between; height: 40px">
        <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Good evening</div>
        <div style="font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.5)">1,290 songs on 2 sources</div>
      </div>

      <!-- Now playing / Continue card: Home's player, so no mini-player here -->
      <div style="position: relative; margin-top: 18px; height: 132px; border-radius: 28px; overflow: hidden; display: flex; align-items: center; gap: 22px; padding: 0 18px; background: linear-gradient(100deg, rgba(226,85,123,0.30) 0%, rgba(59,42,122,0.30) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 0 1px rgba(255,255,255,0.07) inset">
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 22px; flex: 1 1 auto; min-width: 0; height: 132px">
          <div style="position: relative; flex: 0 0 100px; width: 100px; height: 100px; border-radius: 18px; overflow: hidden; background: linear-gradient(140deg, #3B2A7A 0%, #E2557B 100%)">
            <div style="position: absolute; left: 10px; bottom: 0; font-size: 46px; font-weight: 800; line-height: 1; color: rgba(255,255,255,0.9)">S</div>
          </div>
          <div style="min-width: 0; flex: 1 1 auto">
            <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.14em; color: #FF8FB0">{{cardLabel}}</div>
            <div style="margin-top: 6px; font-size: 28px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Samajavaragamana</div>
            <div style="margin-top: 4px; font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.66); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Sid Sriram · Road Trip · song 1 of 42</div>
            <div style="margin-top: 12px; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.14)">
              <div style="width: 38%; height: 5px; border-radius: 99px; background: #FF8FB0"></div>
            </div>
          </div>
        </a>
        <div style="display: flex; align-items: center; gap: 10px; flex: 0 0 auto">
          <button type="button" aria-label="Previous" style="width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); color: #F7F8FA">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M19 20 9 12l10-8z"></path><path d="M5 19V5" fill="none" stroke-width="2.6" stroke-linecap="round"></path></svg>
          </button>
          <button type="button" aria-label="Play or pause" onClick="{{togglePlay}}" style="width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #FF8FB0; color: #0B0C0F">
            <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.4"></rect><rect x="13.9" y="4" width="4.6" height="16" rx="1.4"></rect></svg>
            </sc-if>
            <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4a1 1 0 0 0-1.5.86z"></path></svg>
            </sc-if>
          </button>
          <button type="button" aria-label="Next" style="width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); color: #F7F8FA">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 10 8-10 8z"></path><path d="M19 5v14" fill="none" stroke-width="2.6" stroke-linecap="round"></path></svg>
          </button>
        </div>
      </div>

      <!-- Sources -->
      <div style="margin-top: 24px; font-size: 14px; font-weight: 800; letter-spacing: 0.14em; color: rgba(255,255,255,0.5)">SOURCES</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 12px">
        <sc-for list="{{sources}}" as="src" hint-placeholder-count="2">
          <a href="Folder.dc.html" style="display: flex; align-items: center; gap: 18px; height: 112px; padding: 0 18px; border-radius: 24px; background: rgba(255,255,255,0.06); box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; width: 80px; height: 80px; border-radius: 16px; overflow: hidden; flex: 0 0 80px">
              <sc-for list="{{src.tiles}}" as="tile" hint-placeholder-count="4">
                <div style="background: linear-gradient(140deg, {{tile.a}} 0%, {{tile.b}} 100%)"></div>
              </sc-for>
            </div>
            <div style="min-width: 0; flex: 1 1 auto">
              <div style="display: flex; align-items: center; gap: 10px">
                <span style="font-size: 22px; font-weight: 800">{{src.name}}</span>
                <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 99px; background: rgba(255,199,44,0.16); color: #FFC72C">{{src.vol}}</span>
              </div>
              <div style="margin-top: 4px; font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.62)">{{src.songs}}</div>
              <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px">
                <div style="flex: 1 1 auto; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.12)">
                  <div style="width: {{src.used}}%; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.55)"></div>
                </div>
                <span style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.5); white-space: nowrap">{{src.space}}</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>

      <!-- Recent folders -->
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 24px">
        <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.14em; color: rgba(255,255,255,0.5)">RECENT FOLDERS</span>
        <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.14em; color: rgba(255,255,255,0.32)">MOST PLAYED · RECENTLY ADDED →</span>
      </div>
      <div style="display: flex; gap: 16px; margin-top: 12px; margin-right: -36px; overflow: hidden">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="5">
          <a href="Folder.dc.html" style="position: relative; flex: 0 0 168px; width: 168px">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; width: 168px; height: 168px; border-radius: 22px; overflow: hidden">
              <sc-for list="{{f.tiles}}" as="tile" hint-placeholder-count="4">
                <div style="background: linear-gradient(140deg, {{tile.a}} 0%, {{tile.b}} 100%)"></div>
              </sc-for>
            </div>
            <div style="position: absolute; right: 10px; top: 118px; width: 40px; height: 40px; border-radius: 50%; background: rgba(7,9,12,0.72); display: flex; align-items: center; justify-content: center; color: #F7F8FA">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4a1 1 0 0 0-1.5.86z"></path></svg>
            </div>
            <div style="margin-top: 10px; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</div>
            <div style="margin-top: 2px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.55)">{{f.count}}</div>
          </a>
        </sc-for>
      </div>
    </main>

    <nav aria-label="Main" style="position: relative; flex: 0 0 132px; width: 132px; height: 720px; box-sizing: border-box; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,0.035); border-left: 1px solid rgba(255,255,255,0.06)">
      <div style="text-align: center; font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; margin-bottom: 18px">8:50</div>
      <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; color: rgba(255,255,255,0.78)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <span style="font-size: 14px; font-weight: 700">Playing</span>
      </a>
      <a href="Home.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; background: rgba(255,143,176,0.16); color: #FF8FB0">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
        <span style="font-size: 14px; font-weight: 700">Home</span>
      </a>
      <a href="Folder.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; color: rgba(255,255,255,0.78)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect></svg>
        <span style="font-size: 14px; font-weight: 700">Library</span>
      </a>
      <button type="button" style="all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 22px; color: rgba(255,255,255,0.78)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="font-size: 14px; font-weight: 700">Search</span>
      </button>
      <div style="flex: 1 1 auto"></div>
      <button type="button" aria-label="Settings" style="all: unset; cursor: pointer; display: flex; justify-content: center; padding: 14px 0; color: rgba(255,255,255,0.6)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
      </button>
      <button type="button" aria-label="Exit to launcher" style="all: unset; cursor: pointer; display: flex; justify-content: center; padding: 14px 0; color: rgba(255,255,255,0.6)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
      </button>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
const HOME_PAL = {
  pink: { a: '#3B2A7A', b: '#E2557B' }, sea: { a: '#0E5E6F', b: '#F2C14E' }, ember: { a: '#8A1C14', b: '#F08A24' },
  dusk: { a: '#1D3557', b: '#E76F51' }, teal: { a: '#264653', b: '#2A9D8F' }, sky: { a: '#1B4FBF', b: '#7FD3FF' },
  plum: { a: '#4A1942', b: '#C33C54' }, moss: { a: '#283618', b: '#A3B18A' }, gold: { a: '#5C3D00', b: '#FFC72C' }
};
function homeTiles(keys) { return keys.map((k) => HOME_PAL[k]); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true };
  }
  renderVals() {
    const playing = this.state.playing;
    return {
      playing,
      paused: !playing,
      cardLabel: playing ? 'NOW PLAYING' : 'CONTINUE',
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      sources: [
        { name: 'SanDisk USB', vol: 'MIXTAPE VOL. 2', songs: '1,204 songs · 37 folders', used: 57, space: '18.2 of 32 GB', tiles: homeTiles(['ember', 'sky', 'pink', 'teal']) },
        { name: 'Internal', vol: 'MIXTAPE VOL. 1', songs: '86 songs · 4 folders', used: 57, space: '9.1 of 16 GB', tiles: homeTiles(['gold', 'plum', 'moss', 'dusk']) }
      ],
      folders: [
        { name: 'Road Trip', count: '42 songs', tiles: homeTiles(['pink', 'dusk', 'sea', 'ember']) },
        { name: 'Telugu Melodies', count: '118 songs', tiles: homeTiles(['plum', 'pink', 'gold', 'teal']) },
        { name: '90s Bollywood', count: '86 songs', tiles: homeTiles(['ember', 'gold', 'dusk', 'plum']) },
        { name: 'Old Is Gold', count: '64 songs', tiles: homeTiles(['moss', 'gold', 'sky', 'dusk']) },
        { name: 'Workout', count: '34 songs', tiles: homeTiles(['sky', 'teal', 'ember', 'pink']) },
        { name: 'Devotional', count: '18 songs', tiles: homeTiles(['gold', 'moss', 'plum', 'sea']) }
      ]
    };
  }
}
</script>
</body>
</html>
