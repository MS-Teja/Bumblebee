<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bumblebee — Glance mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090C}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #2E0B07; font-family: 'Manrope', sans-serif; color: #F7F8FA">
  <div style="position: absolute; left: -260px; top: -220px; width: 1000px; height: 1000px; border-radius: 50%; background: #F08A24; opacity: 0.30; filter: blur(140px)"></div>
  <div style="position: absolute; right: -300px; bottom: -380px; width: 900px; height: 900px; border-radius: 50%; background: #8A1C14; opacity: 0.45; filter: blur(150px)"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, rgba(7,9,12,0) 0%, rgba(7,9,12,0.45) 55%, rgba(7,9,12,0.88) 100%)"></div>
  <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none" aria-hidden="true">
    <filter id="beeGrainG"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    <rect width="100%" height="100%" filter="url(#beeGrainG)" opacity="0.06"></rect>
  </svg>

  <!-- Same geometry as Now Playing: the 132px rail is gone but keeps its slot, so every button centre is unchanged -->
  <div style="position: relative; display: flex; width: 1280px; height: 720px">
    <div style="position: relative; flex: 0 0 600px; height: 720px">
      <div style="position: absolute; left: 96px; top: 168px; width: 408px; height: 408px; border-radius: 50%; background: #FFA24D; opacity: 0.55; filter: blur(70px)"></div>
      <div style="position: absolute; left: 33px; top: 93px; width: 534px; height: 534px; border-radius: 32px; overflow: hidden; background: linear-gradient(140deg, #8A1C14 0%, #F08A24 100%); box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset">
        <div style="position: absolute; right: -95px; top: -95px; width: 340px; height: 340px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.22)"></div>
        <div style="position: absolute; right: -42px; top: -42px; width: 232px; height: 232px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.14)"></div>
        <div style="position: absolute; left: 38px; top: 36px; font-size: 18px; font-weight: 700; letter-spacing: 0.14em; color: rgba(255,255,255,0.82)">RRR</div>
        <div style="position: absolute; left: 32px; bottom: 6px; font-size: 200px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: rgba(255,255,255,0.9)">NN</div>
      </div>
    </div>

    <div style="position: relative; flex: 1 1 auto; height: 720px; padding: 0 36px 0 20px; box-sizing: border-box; display: flex; flex-direction: column">
      <div style="height: 190px; flex: 0 0 190px"></div>
      <div style="width: calc(100% + 132px); height: 210px">
        <div style="font-size: 66px; font-weight: 800; line-height: 1.06; letter-spacing: -0.02em">Naatu Naatu</div>
        <div style="margin-top: 14px; font-size: 30px; font-weight: 700; color: #FFA24D">Rahul Sipligunj, Kaala Bhairava</div>
      </div>
      <div style="height: 81px; flex: 0 0 81px"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 18px; height: 150px">
        <div style="width: 60px; height: 60px"></div>
        <button type="button" aria-label="Previous" style="width: 100px; height: 100px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); color: #F7F8FA; transform: scale(1.12)">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M19 20 9 12l10-8z"></path><path d="M5 19V5" fill="none" stroke-width="2.6" stroke-linecap="round"></path></svg>
        </button>
        <button type="button" aria-label="Pause" style="width: 144px; height: 144px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; background: #FFA24D; color: #0B0C0F; box-shadow: 0 10px 40px rgba(255,162,77,0.35); transform: scale(1.12)">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.4"></rect><rect x="13.9" y="4" width="4.6" height="16" rx="1.4"></rect></svg>
        </button>
        <button type="button" aria-label="Next" style="width: 100px; height: 100px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); color: #F7F8FA; transform: scale(1.12)">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 10 8-10 8z"></path><path d="M19 5v14" fill="none" stroke-width="2.6" stroke-linecap="round"></path></svg>
        </button>
        <div style="width: 60px; height: 60px"></div>
      </div>
    </div>
    <div style="flex: 0 0 132px"></div>
  </div>

  <div style="position: absolute; top: 24px; right: 34px; font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums">8:50</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,0.1)">
    <div style="width: 41%; height: 5px; background: #FFA24D"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
